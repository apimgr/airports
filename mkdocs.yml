# MkDocs configuration for Airports API
# Documentation source files live under docs/.
site_name: Airports API Documentation
site_description: Global airport location information API with GeoIP integration
site_author: casapps
site_url: https://airports.readthedocs.io

# Source directory (markdown files)
docs_dir: docs

# Repository
repo_name: apimgr/airports
repo_url: https://github.com/apimgr/airports
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 casapps

# Theme - Material with Dracula palette
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: pink
  font:
    text: Roboto
    code: Fira Code
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
    logo: material/airport

# Navigation
nav:
  - Home: index.md
  - API Reference: API.md
  - Server Guide: SERVER.md

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - def_list

# Plugins
plugins:
  - search:
      lang: en

# Extra CSS / JS
extra_css:
  - stylesheets/dracula.css

extra_javascript:
  - javascripts/extra.js

# Social links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apimgr/airports
