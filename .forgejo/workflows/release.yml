name: Release

on:
  push:
    tags: ['v*', '*.*.*']
  workflow_dispatch: {}

concurrency:
  group: release-${{ forgejo.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_NAME: airports

jobs:
  build:
    runs-on: docker
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set build info
        run: |
          TAG="${FORGEJO_REF_NAME}"
          VERSION="$TAG"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="${TAG#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u -d "@$BUILD_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
          if [ -f site.txt ]; then echo "OFFICIAL_SITE=$(cat site.txt)" >> "$GITHUB_ENV"; else echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> "$GITHUB_ENV"; fi
      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X 'github.com/apimgr/airports/src/app.Version=${{ env.VERSION }}' -X 'github.com/apimgr/airports/src/app.CommitID=${{ env.COMMIT_ID }}' -X 'github.com/apimgr/airports/src/app.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'github.com/apimgr/airports/src/app.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "airports-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./src
      - name: Build CLI client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "airports-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./src/client
      - name: Build GUI client
        if: hashFiles('src/client/gui/**') != '' && matrix.goos != 'freebsd'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -tags gui -ldflags "$LDFLAGS" -o "airports-cli-gui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./src/client
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airports-${{ matrix.goos }}-${{ matrix.goarch }}
          path: airports-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
      - name: Upload CLI client artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airports-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: airports-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
      - name: Upload GUI client artifact
        if: hashFiles('src/client/gui/**') != '' && matrix.goos != 'freebsd'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airports-cli-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: airports-cli-gui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  sbom:
    runs-on: docker
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM
        run: cyclonedx-gomod mod -json -output "airports-${FORGEJO_REF_NAME#v}-sbom.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airports-sbom
          path: airports-*-sbom.cdx.json

  publish:
    needs: [build, sbom]
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: binaries
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airports-sbom
          path: binaries
      - name: Prepare release assets
        run: |
          TAG="${FORGEJO_REF_NAME}"
          VERSION="$TAG"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="${TAG#v}"; fi
          printf '%s\n' "$VERSION" > binaries/version.txt
          tar --exclude='.git' --exclude='binaries' -czf "binaries/airports-${VERSION}-source.tar.gz" .
          cd binaries
          find . -maxdepth 1 -type f ! -name sha256.txt ! -name sha512.txt -print0 | sort -z | xargs -0 sha256sum > sha256.txt
          find . -maxdepth 1 -type f ! -name sha256.txt ! -name sha512.txt -print0 | sort -z | xargs -0 sha512sum > sha512.txt
      - name: Create Forgejo release and upload assets
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          test -n "$FORGEJO_TOKEN"
          response=$(curl -qsSf -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/releases" \
            -d '{"tag_name":"${{ forgejo.ref_name }}","name":"${{ forgejo.ref_name }}","body":"Airports release ${{ forgejo.ref_name }}"}')
          release_id=$(printf '%s' "$response" | jq -r '.id')
          test -n "$release_id" && test "$release_id" != null
          for asset in binaries/*; do
            curl -qsSf -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Content-Type: application/octet-stream' \
              "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/releases/${release_id}/assets?name=$(basename "$asset")" \
              --data-binary "@$asset"
          done
