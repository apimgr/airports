name: airports

# Production Docker Compose Configuration
# Hardcoded sane defaults - works with zero .env file
# Override by editing this file directly

services:
  airports:
    image: ghcr.io/apimgr/airports:latest
    container_name: airports-app
    restart: always

    environment:
      # Hardcoded sane defaults - NO .env files
      - MODE=production
      - TZ=America/New_York
      - PORT=80
      - ADDRESS=0.0.0.0
      # ENABLE_TOR=true is the default

    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z

    ports:
      # Bound to Docker bridge - reverse proxy handles external
      - "172.17.0.1:64580:80"

    networks:
      - airports

    healthcheck:
      test: ["CMD", "/usr/local/bin/airports", "--status"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 10m

networks:
  airports:
    name: airports
    external: false
    driver: bridge
