name: airports-dev

# Development Docker Compose Configuration
# HUMAN USE ONLY — AI/automated tooling must NOT run this file.
x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  airports:
    image: ghcr.io/apimgr/airports:devel
    container_name: airports-app
    hostname: airports
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
    ports:
      - "64580:80"
    volumes:
      - ./volumes/config:/config
      - ./volumes/data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/airports", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - airports-dev

networks:
  airports-dev:
    name: airports-dev
    external: false
