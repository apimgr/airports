name: airports-test

# Automated test compose only. Copy this file to a unique temp directory before use; never run it from the repository root because relative volumes resolve from the working directory.
x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  airports:
    image: ghcr.io/apimgr/airports:devel
    pull_policy: always
    container_name: airports-test
    hostname: airports
    restart: "no"
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
      CACHE_URL: valkey://airports-cache-test:6379
    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64581:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/airports", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      airports-cache-test:
        condition: service_healthy
    networks:
      - airports-test

  airports-cache-test:
    image: valkey/valkey:alpine
    pull_policy: always
    container_name: airports-cache-test
    restart: "no"
    logging: *default-logging
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - airports-test

networks:
  airports-test:
    name: airports-test
    external: false
