{{define "content"}}
<div class="page-header">
    <h1>🌍 GeoIP Lookup</h1>
    <p>Identify the geographic location of an IP address and find nearby airports.</p>
</div>

<div class="search-box">
    <form id="geoip-form" onsubmit="lookupIP(event)">
        <div class="search-input-group">
            <input type="text" id="ip-input" name="ip" class="search-input"
                   placeholder="Enter IP address (e.g. 8.8.8.8)"
                   pattern="^(\d{1,3}\.){3}\d{1,3}$"
                   autocomplete="off">
            <button type="submit" class="btn-primary">Lookup</button>
        </div>
    </form>
</div>

<div id="geoip-result" class="result-container" style="display:none">
    <div class="result-card" id="location-card">
        <h2>📍 Location</h2>
        <div class="result-data" id="location-data"></div>
    </div>
    <div class="result-card" id="nearby-card">
        <h2>✈️ Nearby Airports</h2>
        <div class="result-data" id="nearby-data"></div>
    </div>
</div>

<div id="geoip-error" class="error-container" style="display:none">
    <p id="error-message"></p>
</div>

{{end}}
