{{define "content"}}
<div class="page-header">
    <h1>🌍 GeoIP Lookup</h1>
    <p>Identify the geographic location of an IP address and find nearby airports.</p>
</div>

<div class="search-box">
    <form id="geoip-form" onsubmit="lookupIP(event)">
        <div class="search-input-group">
            <input type="text" id="ip-input" name="ip" class="search-input"
                   placeholder="Enter IP address (e.g. 8.8.8.8)"
                   pattern="^(\d{1,3}\.){3}\d{1,3}$"
                   autocomplete="off">
            <button type="submit" class="btn-primary">Lookup</button>
        </div>
    </form>
</div>

<div id="geoip-result" class="result-container" style="display:none">
    <div class="result-card" id="location-card">
        <h2>📍 Location</h2>
        <div class="result-data" id="location-data"></div>
    </div>
    <div class="result-card" id="nearby-card">
        <h2>✈️ Nearby Airports</h2>
        <div class="result-data" id="nearby-data"></div>
    </div>
</div>

<div id="geoip-error" class="error-container" style="display:none">
    <p id="error-message"></p>
</div>

<script>
function lookupIP(event) {
    event.preventDefault();
    const ip = document.getElementById('ip-input').value.trim();
    if (!ip) return;

    const result = document.getElementById('geoip-result');
    const errBox = document.getElementById('geoip-error');
    result.style.display = 'none';
    errBox.style.display = 'none';

    fetch('/api/v1/geoip/' + encodeURIComponent(ip))
        .then(r => r.json())
        .then(data => {
            if (data.ok === false) {
                document.getElementById('error-message').textContent = data.message || 'Lookup failed';
                errBox.style.display = 'block';
                return;
            }
            const loc = document.getElementById('location-data');
            loc.innerHTML = `
                <dl>
                    <dt>IP</dt><dd>${data.ip || ip}</dd>
                    <dt>Country</dt><dd>${data.country_name || '-'} (${data.country_code || '-'})</dd>
                    <dt>City</dt><dd>${data.city || '-'}</dd>
                    <dt>Latitude</dt><dd>${data.lat || '-'}</dd>
                    <dt>Longitude</dt><dd>${data.lon || '-'}</dd>
                    <dt>ASN</dt><dd>${data.asn || '-'}</dd>
                    <dt>ISP</dt><dd>${data.isp || '-'}</dd>
                </dl>`;
            result.style.display = 'block';

            if (data.lat && data.lon) {
                fetch('/api/v1/geoip/airports/nearby?ip=' + encodeURIComponent(ip))
                    .then(r => r.json())
                    .then(nearby => {
                        const airports = nearby.data || [];
                        if (!airports.length) {
                            document.getElementById('nearby-data').textContent = 'No airports found nearby.';
                            return;
                        }
                        document.getElementById('nearby-data').innerHTML = airports.slice(0, 10).map(a =>
                            `<div class="airport-item">
                                <strong>${a.name}</strong>
                                <span class="airport-codes">${a.icao || ''} ${a.iata ? '/ ' + a.iata : ''}</span>
                                <span class="airport-dist">${a.distance_km ? a.distance_km.toFixed(1) + ' km' : ''}</span>
                            </div>`
                        ).join('');
                    })
                    .catch(() => {
                        document.getElementById('nearby-data').textContent = 'Could not load nearby airports.';
                    });
            }
        })
        .catch(err => {
            document.getElementById('error-message').textContent = 'Request failed: ' + err.message;
            errBox.style.display = 'block';
        });
}
</script>
{{end}}
