name: Security

on:
  push:
    branches:
      - main
      - master
      - devel
      - dev
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    container: golang:alpine
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: apk add --no-cache git bash

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          curl -q -LSsf -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          mkdir -p /tmp/gl && tar -xzf /tmp/gitleaks.tgz -C /tmp/gl
          /tmp/gl/gitleaks detect --source . --no-banner --redact --exit-code 1

  workflow-policy:
    name: Workflow policy check (action pinning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify all third-party actions are pinned to a full SHA
        run: |
          set -e
          fail=0
          # Find any 'uses: org/repo@ref' where ref is not a 40-char SHA
          # Skip same-repo workflow refs (uses: ./...)
          while IFS= read -r line; do
            ref=$(printf '%s' "$line" | sed -E 's/.*uses:[[:space:]]*([^[:space:]#]+).*/\1/')
            case "$ref" in
              ./*) continue ;;
              */*@*)
                sha=${ref#*@}
                if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
                  echo "UNPINNED: $line"
                  fail=1
                fi
                ;;
            esac
          done < <(grep -rhnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/)
          if [ $fail -ne 0 ]; then
            echo "ERROR: third-party actions must be pinned to a 40-char commit SHA"
            exit 1
          fi
          echo "OK: all third-party actions pinned to full SHA"
