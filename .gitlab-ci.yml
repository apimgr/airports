variables:
  PROJECT_NAME: airports
  PROJECT_ORG: apimgr
  BUILD_IMAGE: casjaysdev/go:latest
  CGO_ENABLED: "0"
  GIT_DEPTH: "0"

stages:
  - lint
  - security
  - build
  - test
  - package
  - release
  - docker

build:
  stage: build
  image: $BUILD_IMAGE
  parallel:
    matrix:
      - GOOS: [linux, darwin, windows, freebsd]
        GOARCH: [amd64, arm64]
  script:
    - if [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#v}"; elif [ "$CI_COMMIT_BRANCH" = beta ]; then VERSION="$(date -u +%Y%m%d%H%M%S)-beta"; else VERSION="${CI_COMMIT_SHA:0:7}"; fi
    - COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - BUILD_EPOCH="$(date -u +%s)"
    - BUILD_DATE="$(date -u -d "@$BUILD_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")"
    - OFFICIAL_SITE="${OFFICIAL_SITE:-}"
    - LDFLAGS="-s -w -X 'github.com/apimgr/airports/src/app.Version=${VERSION}' -X 'github.com/apimgr/airports/src/app.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/airports/src/app.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/airports/src/app.OfficialSite=${OFFICIAL_SITE}'"
    - CLI_LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
    - EXT=""; if [ "$GOOS" = windows ]; then EXT=".exe"; fi
    - GOOS=linux GOARCH=amd64 go run ./src/swagger/cmd/openapi-gen
    - go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "${PROJECT_NAME}-${GOOS}-${GOARCH}${EXT}" ./src
    - go build -buildvcs=false -trimpath -ldflags "$CLI_LDFLAGS" -o "${PROJECT_NAME}-cli-${GOOS}-${GOARCH}${EXT}" ./src/client
  artifacts:
    paths:
      - airports-*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: $BUILD_IMAGE
  script:
    - mkdir -p "/tmp/${CI_PROJECT_NAMESPACE}"
    - COVDIR=$(mktemp -d "/tmp/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}-XXXXXX")
    - trap 'rm -rf "$COVDIR"' EXIT
    - go test -coverprofile="$COVDIR/coverage.out" ./...
    - PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
    - if [ "$PCT" -lt 60 ]; then echo "coverage ${PCT}% is below the 60% threshold"; exit 1; fi
    - cp "$COVDIR/coverage.out" coverage.out
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: lint
  image: $BUILD_IMAGE
  script:
    - go vet ./...
    - staticcheck ./...
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

secret-scan:
  stage: security
  image: trufflesecurity/trufflehog:latest
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        trufflehog git file://. --since-commit "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --branch "$CI_COMMIT_SHA" --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt --fail
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && [ "$CI_PIPELINE_SOURCE" = "push" ]; then
        trufflehog git file://. --since-commit "$CI_COMMIT_BEFORE_SHA" --branch "$CI_COMMIT_SHA" --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt --fail
      else
        trufflehog git file://. --results=verified --exclude-paths=.github/trufflehog-exclude.txt --fail
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

vuln-scan:
  stage: security
  image: $BUILD_IMAGE
  script:
    - govulncheck ./...
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

workflow-policy:
  stage: security
  image: $BUILD_IMAGE
  script:
    - |
      bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
      if [ -n "$bad" ]; then echo "unpinned actions found:"; echo "$bad"; exit 1; fi

image-build:
  stage: security
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t local/scan-target:ci -f docker/Dockerfile .
    - docker save local/scan-target:ci -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - exists:
        - docker/Dockerfile

image-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [image-build]
  script:
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --input image.tar
  rules:
    - exists:
        - docker/Dockerfile

release:
  stage: release
  image: $BUILD_IMAGE
  script:
    - test -n "$CI_COMMIT_TAG"
    - mkdir -p binaries
    - cp airports-* binaries/
    - printf '%s\n' "${CI_COMMIT_TAG#v}" > binaries/version.txt
    - printf 'Airports %s release\n\nIncludes cross-platform server and CLI binaries, source archive, CycloneDX SBOM, and checksums.\n' "$CI_COMMIT_TAG" > binaries/release-notes.txt
    - tar --exclude='.git' --exclude='binaries' -czf "binaries/airports-${CI_COMMIT_TAG#v}-source.tar.gz" .
    - cd binaries
    - FILES="airports-* version.txt release-notes.txt"
    - sha256sum $FILES > sha256.txt
    - sha512sum $FILES > sha512.txt
  artifacts:
    paths:
      - binaries/
    expire_in: 1 week
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Airports $CI_COMMIT_TAG"
    description: "Airports $CI_COMMIT_TAG release. Includes cross-platform server and CLI binaries, source archive, CycloneDX SBOM, and checksums."
    assets:
      links:
        - name: "Airports $CI_COMMIT_TAG release bundle"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download?file_type=archive"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

sbom:
  stage: security
  image: $BUILD_IMAGE
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - cyclonedx-gomod mod -json -output "airports-${VERSION}-sbom.cdx.json"
  artifacts:
    paths:
      - airports-*-sbom.cdx.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
